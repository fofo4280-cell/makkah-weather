<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>موقع فهد العيسي لمتابعة الأحوال الجوية في محيط مكة المكرمة ومنطقة مكة المكرمة</title>
<meta name="description" content="منصة شخصية لمتابعة الحمل الحراري والأمطار في منطقة مكة المكرمة: خرائط، ونماذج ECMWF وGFS وICON، وأقمار صناعية، وتحليل عربي.">
<meta name="theme-color" content="#0f6e7a" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11171b" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="طقس مكة">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <span class="brand-name">موقع فهد العيسي</span>
      <span class="brand-sub">لمتابعة الأحوال الجوية في محيط مكة المكرمة ومنطقة مكة المكرمة</span>
    </div>
    <div class="top-actions">
      <button id="placeBtn" class="place-chip" aria-label="اختيار الموقع"><span id="placeName">مكة المكرمة</span><svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true"><path d="M5 8l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
      <button id="refreshBtn" class="icon-btn" aria-label="تحديث البيانات"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </div>
  </header>
  <div id="statusBar" class="status" role="status" aria-live="polite"></div>

  <main>
    <section id="tab-map" class="tab tab-map">
      <div id="map" aria-label="الخريطة"></div>
      <div class="mtop">
        <button id="layersBtn" class="fab" aria-label="طبقات الخريطة"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5 9-5zm-9 9l9 5 9-5M3 16l9 5 9-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>الطبقات</span></button>
        <div id="fieldChips" class="fchips" role="group" aria-label="حقل التوقع"></div>
      </div>
      <div id="mapBusy" class="map-busy" hidden><div class="spinner"></div><span>جارٍ تحميل الحقل…</span></div>
      <div id="mapBars" class="map-bars"></div>
    </section>
    <section id="tab-report" class="tab scroll" hidden></section>
    <section id="tab-escarp" class="tab scroll" hidden></section>
    <section id="tab-conv" class="tab scroll" hidden></section>
    <section id="tab-models" class="tab scroll" hidden></section>
    <section id="tab-analysis" class="tab scroll" hidden></section>
    <section id="tab-more" class="tab scroll" hidden></section>
  </main>

  <nav class="tabbar" aria-label="الأقسام">
    <button data-tab="map"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zm0 0v14m6-12v14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>الخريطة</span></button>
    <button data-tab="report"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 13a4 4 0 0 1-.4-8A5 5 0 0 1 16 5.6 3.5 3.5 0 0 1 16.5 13H7zm1.5 3l-1 3m5-3l-1 3m5-3l-1 3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>التقرير</span></button>
    <button data-tab="escarp"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 19l6-9 4 5 3-4 7 8H2zm13-11a2 2 0 1 0 0-.01" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>الجرف</span></button>
    <button data-tab="conv"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 15a4 4 0 0 1-.5-8A5.5 5.5 0 0 1 17 7.5 3.75 3.75 0 0 1 17 15H7zm6 0l-2 4h3l-2 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg><span>الحمل</span></button>
    <button data-tab="models"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10m5.5 10V4M15 20v-7m5 7V8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><span>النماذج</span></button>
    <button data-tab="analysis"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6zM9 11h7M9 15h7M9 7h3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>التحليل</span></button>
    <button data-tab="more"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="19" cy="12" r="1.8" fill="currentColor"/></svg><span>المزيد</span></button>
  </nav>
</div>
<div id="scrim" class="scrim" hidden></div>
<div id="sheet" class="sheet" role="dialog" aria-modal="true" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>
<script src="vendor/leaflet/leaflet.js"></script>
<script type="module" src="js/app.js"></script>
<noscript><p style="padding:16px">يحتاج الموقع إلى تفعيل JavaScript.</p></noscript>
</body>
</html>
