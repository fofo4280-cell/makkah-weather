# Daily MJO, warm/cold event and moisture-surge products for the model page (the التذبذب tab), and the daily
# report: the day's weather over the Kingdom region by region, and signs of a new rain wave in 15 and 45 days.
# Code: saudi-wrf branch, server/climate. Results: climate-data branch.
# Everything on the page is refreshed once a day around midnight Makkah time (20:31 UTC) from the 12 UTC GFS run;
# the job waits for that run to reach 15 days if it is not complete yet.
name: Climate MJO

on:
  schedule:
    - cron: '31 20 * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/climate.yml', 'model/climate-now.txt']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: climate
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-24.04
    timeout-minutes: 420
    steps:
      - name: Wait for today's GFS run
        run: |
          H=$(date -u +%H); D=$(date -u +%Y%m%d)
          if [ "$H" -ge 17 ]; then C=12; elif [ "$H" -ge 5 ]; then C=00; else exit 0; fi
          U="https://noaa-gfs-bdp-pds.s3.amazonaws.com/gfs.$D/$C/atmos/gfs.t${C}z.pgrb2.1p00.f360.idx"
          for i in $(seq 1 80); do curl -sf -m 30 "$U" >/dev/null && exit 0; sleep 60; done

      - name: Code
        uses: actions/checkout@v4
        with:
          ref: saudi-wrf
          path: code

      - name: Python packages
        run: pip install -q numpy scipy pillow netCDF4 pyshtools pygrib matplotlib cartopy arabic-reshaper python-bidi

      - name: Restore climatology
        id: clim
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/clim
          key: clim-r1-1991-2020-v2

      - name: Build climatology (first run only)
        if: steps.clim.outputs.cache-hit != 'true'
        run: python3 code/server/climate/build_clim.py /home/runner/clim

      - name: Keep climatology
        if: steps.clim.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/clim
          key: clim-r1-1991-2020-v2

      - name: Restore recent analyses
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/mjo_state
          key: mjo-hist-${{ github.run_id }}
          restore-keys: mjo-hist-

      - name: Previous results
        run: |
          git clone -q --depth 1 --branch climate-data "https://github.com/${GITHUB_REPOSITORY}" /home/runner/out || mkdir -p /home/runner/out
          rm -rf /home/runner/out/.git

      - name: Wait for our 12 UTC Kingdom run (rain of the next day in the report)
        id: wait
        run: |
          # the 12 UTC Kingdom run (33 hours) covers the whole next Makkah day; wait for it, but not past 22:30 UTC.
          # The western 3 km run (two runners, also 33 hours) ends later: if it is not complete now, the day's
          # sections of the report are rebuilt and published again when it is (see the last steps).
          R="$(date -u +%Y%m%d)12"
          echo "run=$R" >> "$GITHUB_OUTPUT"
          done_on() { curl -sf -m 30 "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/$1/runs.json?$(date +%s)" \
            | python3 -c "import json,sys; r=[x for x in json.load(sys.stdin)['runs'] if x['run']=='$R']; sys.exit(0 if r and r[0]['status']=='complete' else 1)"; }
          if [ "$(date -u +%H)" -lt 17 ]; then echo "west=skip" >> "$GITHUB_OUTPUT"; exit 0; fi   # a run by hand during the day
          until done_on model-data-sa; do
            [ "$(date -u +%H%M)" -ge 2230 ] && { echo "Kingdom run $R not complete by 22:30 UTC"; break; }
            sleep 300
          done
          if done_on model-data; then echo "west=done" >> "$GITHUB_OUTPUT"; else echo "west=later" >> "$GITHUB_OUTPUT"; fi

      - name: Our model runs (rain of the day in the report)
        run: |
          for b in model-data-sa:sa model-data:west model-data-1km:km1; do
            git clone -q --depth 1 --filter=blob:none --sparse --branch "${b%%:*}" "https://github.com/${GITHUB_REPOSITORY}" "/home/runner/${b##*:}" || continue
            git -C "/home/runner/${b##*:}" sparse-checkout set --no-cone '/runs.json' '/runs/*/manifest.json' '/runs/*/*/points.bin' || true
          done
          du -sh /home/runner/sa /home/runner/west /home/runner/km1 2>/dev/null || true

      - name: Compute
        env:
          SA_DATA: /home/runner/sa
          WEST_DATA: /home/runner/west
          KM1_DATA: /home/runner/km1
        run: python3 code/server/climate/daily.py /home/runner/clim /home/runner/mjo_state /home/runner/out

      - name: Keep recent analyses
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /home/runner/mjo_state
          key: mjo-hist-${{ github.run_id }}

      - name: Publish
        run: |
          cd /home/runner/out
          ls reports 2>/dev/null | sort | head -n -40 | xargs -r -I{} rm -f reports/{}
          git init -q -b data
          git -c user.name="climate bot" -c user.email="actions@users.noreply.github.com" add -A
          git -c user.name="climate bot" -c user.email="actions@users.noreply.github.com" commit -q -m "climate data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:climate-data

      - name: Wait for the western 3 km run and rebuild the day's report
        id: refresh
        if: steps.wait.outputs.west == 'later'
        env:
          SA_DATA: /home/runner/sa
          WEST_DATA: /home/runner/west
          KM1_DATA: /home/runner/km1
        run: |
          R="${{ steps.wait.outputs.run }}"
          done_on() { curl -sf -m 30 "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/$1/runs.json?$(date +%s)" \
            | python3 -c "import json,sys; r=[x for x in json.load(sys.stdin)['runs'] if x['run']=='$R']; sys.exit(0 if r and r[0]['status']=='complete' else 1)"; }
          until done_on model-data; do
            h=$(date -u +%H%M); if [ "$h" -ge 0245 ] && [ "$h" -lt 1700 ]; then echo "western run $R not complete by 02:45 UTC"; exit 0; fi
            sleep 300
          done
          for b in model-data:west model-data-1km:km1; do
            rm -rf "/home/runner/${b##*:}"
            git clone -q --depth 1 --filter=blob:none --sparse --branch "${b%%:*}" "https://github.com/${GITHUB_REPOSITORY}" "/home/runner/${b##*:}" || continue
            git -C "/home/runner/${b##*:}" sparse-checkout set --no-cone '/runs.json' '/runs/*/manifest.json' '/runs/*/*/points.bin' || true
          done
          rm -rf /home/runner/out/.git
          python3 code/server/climate/refresh_report.py /home/runner/mjo_state /home/runner/out && echo "done=yes" >> "$GITHUB_OUTPUT"

      - name: Publish the rebuilt report
        if: steps.refresh.outputs.done == 'yes'
        run: |
          cd /home/runner/out
          git init -q -b data
          git -c user.name="climate bot" -c user.email="actions@users.noreply.github.com" add -A
          git -c user.name="climate bot" -c user.email="actions@users.noreply.github.com" commit -q -m "climate data, report with the 3 km run $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:climate-data
