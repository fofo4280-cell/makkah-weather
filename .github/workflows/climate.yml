# Daily MJO, warm/cold event and moisture-surge products for the model page (the التذبذب tab).
# Code: saudi-wrf branch, server/climate. Results: climate-data branch.
# 05:20 UTC = 08:20 Makkah time, when the 00 UTC GFS run is complete to 15 days.
name: Climate MJO

on:
  schedule:
    - cron: '20 5 * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/climate.yml', 'model/climate-now.txt']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: climate
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Code
        uses: actions/checkout@v4
        with:
          ref: saudi-wrf
          path: code

      - name: Python packages
        run: pip install -q numpy scipy pillow netCDF4 pyshtools pygrib

      - name: Restore climatology
        id: clim
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/clim
          key: clim-r1-1991-2020-v1

      - name: Build climatology (first run only)
        if: steps.clim.outputs.cache-hit != 'true'
        run: python3 code/server/climate/build_clim.py /home/runner/clim

      - name: Keep climatology
        if: steps.clim.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/clim
          key: clim-r1-1991-2020-v1

      - name: Restore recent analyses
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/mjo_state
          key: mjo-hist-${{ github.run_id }}
          restore-keys: mjo-hist-

      - name: Previous results
        run: |
          git clone -q --depth 1 --branch climate-data "https://github.com/${GITHUB_REPOSITORY}" /home/runner/out || mkdir -p /home/runner/out
          rm -rf /home/runner/out/.git

      - name: Compute
        run: python3 code/server/climate/daily.py /home/runner/clim /home/runner/mjo_state /home/runner/out

      - name: Keep recent analyses
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /home/runner/mjo_state
          key: mjo-hist-${{ github.run_id }}

      - name: Publish
        run: |
          cd /home/runner/out
          ls reports 2>/dev/null | sort | head -n -40 | xargs -r -I{} rm -f reports/{}
          git init -q -b data
          git -c user.name="climate bot" -c user.email="actions@users.noreply.github.com" add -A
          git -c user.name="climate bot" -c user.email="actions@users.noreply.github.com" commit -q -m "climate data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:climate-data
