# Daily MJO, warm/cold event, Rossby wave and moisture products for the model page (the التذبذب tab), and the two
# reports: rain over the Kingdom for the Makkah day from our own model, and the big picture (now, the next wave,
# northern cold troughs day by day, cold waves, beyond 15 days).
# Code: saudi-wrf branch, server/climate. Results: climate-data branch.
# The maps and the big picture are refreshed every night at midnight Makkah time from the 12 UTC GFS run. The rain
# report is written then if our 12 UTC runs are complete, otherwise as soon as they are (the last steps); it is
# updated again at noon from the 00 UTC runs (rain-noon.yml).
name: Climate MJO

on:
  schedule:
    - cron: '33 20 * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/climate.yml', 'model/climate-now.txt']
  workflow_dispatch:
    inputs:
      ref:
        description: 'code branch'
        default: 'saudi-wrf'
      target:
        description: 'data branch to publish to (climate-data is the page)'
        default: 'climate-data'

permissions:
  contents: write

concurrency:
  group: climate
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-24.04
    timeout-minutes: 420
    steps:
      - name: Wait for today's GFS run
        run: |
          H=$(date -u +%H); D=$(date -u +%Y%m%d)
          if [ "$H" -ge 17 ]; then C=12; elif [ "$H" -ge 5 ]; then C=00; else exit 0; fi
          U="https://noaa-gfs-bdp-pds.s3.amazonaws.com/gfs.$D/$C/atmos/gfs.t${C}z.pgrb2.1p00.f360.idx"
          for i in $(seq 1 80); do curl -sf -m 30 "$U" >/dev/null && exit 0; sleep 60; done

      - name: Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'saudi-wrf' }}
          path: code

      - name: Python packages
        run: pip install -q numpy scipy pillow netCDF4 pyshtools pygrib matplotlib cartopy arabic-reshaper python-bidi

      - name: Restore climatology
        id: clim
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/clim
          key: clim-r1-1991-2020-v2

      - name: Build climatology (first run only)
        if: steps.clim.outputs.cache-hit != 'true'
        run: python3 code/server/climate/build_clim.py /home/runner/clim

      - name: Keep climatology
        if: steps.clim.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/clim
          key: clim-r1-1991-2020-v2

      - name: Restore recent analyses
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/mjo_state
          key: mjo-hist-${{ github.run_id }}
          restore-keys: mjo-hist-

      - name: Previous results
        run: |
          git clone -q --depth 1 --branch climate-data "https://github.com/${GITHUB_REPOSITORY}" /home/runner/out || mkdir -p /home/runner/out
          rm -rf /home/runner/out/.git

      - name: Are our 12 UTC runs complete (rain of the next day in the report)
        id: wait
        run: |
          # the maps are not held back for our model: if the 12 UTC Kingdom run or a 3 km run is not complete now,
          # the rain report is written when they are (the last steps)
          R="$(date -u +%Y%m%d)12"
          echo "run=$R" >> "$GITHUB_OUTPUT"
          done_on() { curl -sf -m 30 "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/$1/runs.json?$(date +%s)" \
            | python3 -c "import json,sys; r=[x for x in json.load(sys.stdin)['runs'] if x['run']=='$R']; sys.exit(0 if r and r[0]['status']=='complete' else 1)"; }
          if [ "$(date -u +%H)" -lt 17 ]; then echo "west=skip" >> "$GITHUB_OUTPUT"; exit 0; fi   # a run by hand during the day
          done_on model-data-sa || echo "pending=1" >> "$GITHUB_OUTPUT"
          # the 3 km runs (western highlands and the regional grids): complete, or not run for this cycle
          done3() { for b in model-data model-data-nw model-data-n model-data-c model-data-e model-data-se; do
            j=$(curl -sf -m 30 "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/$b/runs.json?$(date +%s)") || continue
            echo "$j" | python3 -c "import json,sys; r=[x for x in json.load(sys.stdin)['runs'] if x['run']=='$R']; sys.exit(0 if not r or r[0]['status']=='complete' else 1)" || return 1
          done; }
          if done_on model-data-sa && done3; then echo "west=done" >> "$GITHUB_OUTPUT"; else echo "west=later" >> "$GITHUB_OUTPUT"; fi

      - name: Our model runs (rain of the day in the report)
        run: |
          for b in model-data-sa:sa model-data:west model-data-1km:km1 model-data-nw:r_nw model-data-n:r_n model-data-c:r_c model-data-e:r_e model-data-se:r_se; do
            git clone -q --depth 1 --filter=blob:none --sparse --branch "${b%%:*}" "https://github.com/${GITHUB_REPOSITORY}" "/home/runner/${b##*:}" || continue
            git -C "/home/runner/${b##*:}" sparse-checkout set --no-cone '/runs.json' '/runs/*/manifest.json' '/runs/*/*/points.bin' || true
          done
          du -sh /home/runner/sa /home/runner/west /home/runner/km1 /home/runner/r_* 2>/dev/null || true

      - name: Compute
        env:
          SA_DATA: /home/runner/sa
          WEST_DATA: /home/runner/west
          KM1_DATA: /home/runner/km1
          REGION_DATA: /home/runner/r_nw /home/runner/r_n /home/runner/r_c /home/runner/r_e /home/runner/r_se
          RAIN_PENDING: ${{ steps.wait.outputs.pending }}
        run: python3 code/server/climate/daily.py /home/runner/clim /home/runner/mjo_state /home/runner/out

      - name: Keep recent analyses
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /home/runner/mjo_state
          key: mjo-hist-${{ github.run_id }}

      - name: Publish
        run: |
          cd /home/runner/out
          ls reports 2>/dev/null | sort | head -n -40 | xargs -r -I{} rm -f reports/{}
          git init -q -b data
          git -c user.name="climate bot" -c user.email="actions@users.noreply.github.com" add -A
          git -c user.name="climate bot" -c user.email="actions@users.noreply.github.com" commit -q -m "climate data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${{ inputs.target || 'climate-data' }}

      - name: Wait for our 12 UTC runs and write the rain report
        id: refresh
        if: steps.wait.outputs.west == 'later'
        env:
          SA_DATA: /home/runner/sa
          WEST_DATA: /home/runner/west
          KM1_DATA: /home/runner/km1
          REGION_DATA: /home/runner/r_nw /home/runner/r_n /home/runner/r_c /home/runner/r_e /home/runner/r_se
        run: |
          R="${{ steps.wait.outputs.run }}"
          done_on() { curl -sf -m 30 "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/$1/runs.json?$(date +%s)" \
            | python3 -c "import json,sys; r=[x for x in json.load(sys.stdin)['runs'] if x['run']=='$R']; sys.exit(0 if r and r[0]['status']=='complete' else 1)"; }
          done3() { for b in model-data model-data-nw model-data-n model-data-c model-data-e model-data-se; do
            j=$(curl -sf -m 30 "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/$b/runs.json?$(date +%s)") || continue
            echo "$j" | python3 -c "import json,sys; r=[x for x in json.load(sys.stdin)['runs'] if x['run']=='$R']; sys.exit(0 if not r or r[0]['status']=='complete' else 1)" || return 1
          done; }
          until done_on model-data-sa && done3; do
            h=$(date -u +%H%M); if [ "$h" -ge 0245 ] && [ "$h" -lt 1700 ]; then echo "runs $R not all complete by 02:45 UTC; the report uses what is published"; break; fi
            sleep 300
          done
          for b in model-data-sa:sa model-data:west model-data-1km:km1 model-data-nw:r_nw model-data-n:r_n model-data-c:r_c model-data-e:r_e model-data-se:r_se; do
            rm -rf "/home/runner/${b##*:}"
            git clone -q --depth 1 --filter=blob:none --sparse --branch "${b%%:*}" "https://github.com/${GITHUB_REPOSITORY}" "/home/runner/${b##*:}" || continue
            git -C "/home/runner/${b##*:}" sparse-checkout set --no-cone '/runs.json' '/runs/*/manifest.json' '/runs/*/*/points.bin' || true
          done
          rm -rf /home/runner/out/.git
          python3 code/server/climate/refresh_report.py /home/runner/mjo_state /home/runner/out midnight && echo "done=yes" >> "$GITHUB_OUTPUT"

      - name: Publish the rebuilt report
        if: steps.refresh.outputs.done == 'yes'
        run: |
          cd /home/runner/out
          git init -q -b data
          git -c user.name="climate bot" -c user.email="actions@users.noreply.github.com" add -A
          git -c user.name="climate bot" -c user.email="actions@users.noreply.github.com" commit -q -m "climate data, rain report from our 12 UTC runs $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${{ inputs.target || 'climate-data' }}
