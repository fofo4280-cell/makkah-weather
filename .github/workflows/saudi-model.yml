# Twice-daily high-resolution model (WRF) on GitHub runners; code on the saudi-wrf branch, maps shown at /model/.
#   western highlands 3 km (Jazan to the harrats north of Makkah, with the Red Sea) in a 9 km parent, 33 hours:
#     too long for one runner, so it runs in two parts that hand over WRF restart files at hour 15 (a boundary time: a restart between two 3-hourly boundary times blew up) -> model-data
#   regional 3 km grids, split like the western one -> model-data-<id>: south-east, north, centre, east (the others join as they pass their tests)
#   (the 1 km nest over Jeddah-Makkah-Taif, domains.json -> model-data-1km, is paused until the 3 km runs settle)
#   Kingdom-wide 9 km, 33 hours -> model-data-sa
# Runs on the 00 and 12 UTC GFS cycles (full radiosonde assimilation). GitHub often starts scheduled runs late,
# so the schedule is early and the gate job waits for the GFS files; the model jobs then get their full time.
name: Saudi model 3 km

on:
  schedule:
    - cron: '47 2 * * *'
    - cron: '47 14 * * *'
  push:
    branches: [main]
    paths: ['model/run-now.txt']
  workflow_dispatch:
    inputs:
      cycle:
        description: 'GFS cycle YYYYMMDDHH (leave empty for the newest available)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: saudi-model
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Wait for the GFS cycle
        run: |
          [ "${{ github.event_name }}" = "schedule" ] || exit 0
          H=$(date -u +%H); C=$([ "$H" -lt 12 ] && echo 00 || echo 12); D=$(date -u +%Y%m%d)
          U="https://nomads.ncep.noaa.gov/pub/data/nccf/com/gfs/prod/gfs.$D/$C/atmos/gfs.t${C}z.pgrb2.0p25.f033.idx"
          for i in $(seq 1 90); do
            if curl -sfI -m 30 "$U" >/dev/null; then echo "GFS $D $C ready"; exit 0; fi
            sleep 60
          done
          echo "still waiting after 90 minutes; the model job will wait or fall back"

  west:
    needs: gate
    uses: ./.github/workflows/wrf-job.yml
    with:
      name: west
      domains: domains_west.json
      branch: model-data
      cycle: ${{ inputs.cycle }}
      stop_h: '15'

  west2:
    needs: west
    if: always() && needs.west.outputs.handoff == 'yes'
    uses: ./.github/workflows/wrf-job.yml
    with:
      name: west
      domains: domains_west.json
      branch: model-data
      resume: true

  kingdom:
    needs: gate
    uses: ./.github/workflows/wrf-job.yml
    with:
      name: kingdom
      domains: domains_sa.json
      branch: model-data-sa
      cycle: ${{ inputs.cycle }}

  r_se:
    needs: gate
    uses: ./.github/workflows/wrf-job.yml
    with:
      name: r_se
      domains: domains_se.json
      branch: model-data-se
      cycle: ${{ inputs.cycle }}
      stop_h: '15'

  r_se2:
    needs: r_se
    if: always() && needs.r_se.outputs.handoff == 'yes'
    uses: ./.github/workflows/wrf-job.yml
    with:
      name: r_se
      domains: domains_se.json
      branch: model-data-se
      resume: true

  r_n:
    needs: gate
    uses: ./.github/workflows/wrf-job.yml
    with:
      name: r_n
      domains: domains_n.json
      branch: model-data-n
      cycle: ${{ inputs.cycle }}
      stop_h: '15'

  r_n2:
    needs: r_n
    if: always() && needs.r_n.outputs.handoff == 'yes'
    uses: ./.github/workflows/wrf-job.yml
    with:
      name: r_n
      domains: domains_n.json
      branch: model-data-n
      resume: true

  r_c:
    needs: gate
    uses: ./.github/workflows/wrf-job.yml
    with:
      name: r_c
      domains: domains_c.json
      branch: model-data-c
      cycle: ${{ inputs.cycle }}
      stop_h: '15'

  r_c2:
    needs: r_c
    if: always() && needs.r_c.outputs.handoff == 'yes'
    uses: ./.github/workflows/wrf-job.yml
    with:
      name: r_c
      domains: domains_c.json
      branch: model-data-c
      resume: true

  r_e:
    needs: gate
    uses: ./.github/workflows/wrf-job.yml
    with:
      name: r_e
      domains: domains_e.json
      branch: model-data-e
      cycle: ${{ inputs.cycle }}
      stop_h: '15'

  r_e2:
    needs: r_e
    if: always() && needs.r_e.outputs.handoff == 'yes'
    uses: ./.github/workflows/wrf-job.yml
    with:
      name: r_e
      domains: domains_e.json
      branch: model-data-e
      resume: true
