# Study branch (Fahad, 19 Nov 2026): seasonal outlook backtest. Puts the long daily series (CHIRPS Kingdom spread,
# RMM, Nino, DMI) and the latest index tables on branch study-season-data. Dispatch with ref=study/season.
name: Method study

on:
  workflow_dispatch:
    inputs:
      from_run: {description: 'the Tropics study run whose tropics-long series to use', default: '43657761748'}
      hist_run: {description: 'unused', default: ''}
      extra: {description: 'unused', default: ''}

permissions:
  contents: write
  actions: read

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tropics-long
          path: out
          run-id: ${{ inputs.from_run }}
          github-token: ${{ github.token }}
      - run: |
          cd out
          for u in https://psl.noaa.gov/data/correlation/nina34.anom.data https://psl.noaa.gov/gcos_wgsp/Timeseries/Data/dmi.had.long.data \
                   https://psl.noaa.gov/data/timeseries/month/data/nino34.long.anom.data https://psl.noaa.gov/data/timeseries/month/DS/DMI/dmi.long.data \
                   https://www.cpc.ncep.noaa.gov/data/indices/oni.ascii.txt https://www.cpc.ncep.noaa.gov/data/indices/sstoi.indices \
                   https://www.bom.gov.au/clim_data/IDCKGEM000/rmm.74toRealtime.txt; do
            curl -sfL -m 60 -A "Mozilla/5.0" -O "$u" || echo "failed $u"
          done
          ls -la
          git init -q -b study-season-data && git add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "season study data"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" study-season-data
