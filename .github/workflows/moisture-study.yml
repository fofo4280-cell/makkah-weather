# Hand study: where the moisture of a rain wave came from (GFS analyses: water-vapour gates, the trough, back
# trajectories). Printed to the log (nothing published).
name: Moisture study

on:
  workflow_dispatch:
    inputs:
      first: {description: 'first analysis YYYYMMDDHH'}
      last: {description: 'last analysis YYYYMMDDHH'}

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: saudi-wrf
          path: code
      - run: pip install -q numpy scipy pillow netCDF4 pyshtools pygrib matplotlib cartopy arabic-reshaper python-bidi shapely
      - uses: actions/cache/restore@v4
        with:
          path: /home/runner/clim
          key: clim-r1-1991-2020-v2
      - run: python3 code/server/climate/moisture_source.py ${{ inputs.first }} ${{ inputs.last }} /home/runner/clim/clim.npz
