# Short test of the model servers on a code branch; nothing is published (the maps are kept as run artifacts).
# By default it tests the western highlands run split over two runners: part 1 stops at hour stop_h and
# hands its restart files to part 2, which goes on to hour 'hours'.
name: Saudi model test

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'code branch'
        required: false
        default: 'saudi-wrf'
      hours:
        description: "forecast hours, a multiple of 3, or 'full' for the whole run"
        required: false
        default: 'full'
      stop_h:
        description: "hour where part 1 hands over to part 2, or 'none' for one runner"
        required: false
        default: '15'
      with_1km:
        description: 'also test the 1 km server'
        type: boolean
        default: false
      domains:
        description: 'grid design to test (domains_west.json, domains_nw.json, domains_n.json, ...)'
        required: false
        default: 'domains_west.json'
      ic:
        description: 'initial and boundary conditions: gfs or ecmwf (IFS open data)'
        required: false
        default: 'gfs'
      cycle:
        description: 'cycle YYYYMMDDHH (empty: the newest)'
        required: false
        default: ''
      publish_to:
        description: 'publish the run to this data branch (empty: not published)'
        required: false
        default: ''
      ref2:
        description: 'a second code branch run side by side on its own runner (same cycle), to compare speed'
        required: false
        default: 

permissions:
  contents: write

concurrency:
  group: saudi-model-test-${{ inputs.domains }}
  cancel-in-progress: false

jobs:
  west:
    uses: ./.github/workflows/wrf-job.yml
    with:
      name: west
      domains: ${{ inputs.domains }}
      branch: ${{ inputs.publish_to != '' && inputs.publish_to || 'model-data' }}
      code_ref: ${{ inputs.ref }}
      publish: ${{ inputs.publish_to != '' }}
      ic: ${{ inputs.ic }}
      hours: ${{ inputs.hours != 'full' && inputs.hours || '' }}
      stop_h: ${{ inputs.stop_h != 'none' && inputs.stop_h || '' }}
      cycle: ${{ inputs.cycle }}

  west2:
    needs: west
    if: always() && needs.west.outputs.handoff == 'yes'
    uses: ./.github/workflows/wrf-job.yml
    with:
      name: west
      domains: ${{ inputs.domains }}
      branch: ${{ inputs.publish_to != '' && inputs.publish_to || 'model-data' }}
      code_ref: ${{ inputs.ref }}
      publish: ${{ inputs.publish_to != '' }}
      ic: ${{ inputs.ic }}
      hours: ${{ inputs.hours != 'full' && inputs.hours || '' }}
      resume: true

  makkah1km:
    if: inputs.with_1km
    uses: ./.github/workflows/wrf-job.yml
    with:
      name: makkah1km
      domains: domains.json
      branch: model-data-1km
      code_ref: ${{ inputs.ref }}
      publish: false
      hours: ${{ inputs.hours != 'full' && inputs.hours || '' }}
      window: ${{ inputs.hours != 'full' && '3,6' || '' }}

  west_b:
    if: inputs.ref2 != ''
    uses: ./.github/workflows/wrf-job.yml
    with:
      name: west_b
      domains: domains_west.json
      branch: model-data
      code_ref: ${{ inputs.ref2 }}
      publish: false
      hours: ${{ inputs.hours != 'full' && inputs.hours || '' }}
      stop_h: ${{ inputs.stop_h != 'none' && inputs.stop_h || '' }}
