# Twice-daily high-resolution model for Makkah Region (WRF: 9 km parent, 3 km nest, 27 hours).
# Code lives on the saudi-wrf branch; results are pushed to the model-data branch and shown at /model/.
# Two runs 12 hours apart on the main synoptic cycles (full radiosonde assimilation):
# 03:20 UTC = 06:20 Makkah time for the 00 UTC GFS run (maps by about 10:30, before the afternoon storms).
# 15:25 UTC = 18:25 Makkah time for the 12 UTC GFS run (maps by about 22:30, before night and dawn coastal storms).
# A scheduled run waits for its cycle's files if they are not out yet. GitHub may start scheduled runs late.
name: Saudi model test

on:
  push:
    branches: [main]
    paths: ['model/test-now.txt']

permissions:
  contents: write

concurrency:
  group: saudi-model-test
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SWRF: /home/runner/swrf
      WEB: /home/runner/web
      SWRF_TEST: '1'
      NPROC: '4'
      KEEP_RUNS: '3'
      SWRF_HOURS: '6'
      SWRF_WINDOW: '3,6'
      CYCLES: '0 12'
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Model code
        uses: actions/checkout@v4
        with:
          ref: saudi-wrf
          path: code

      - name: Prepare folders
        run: |
          echo "JOB_T0=$(date -u +%s)" >> "$GITHUB_ENV"   # the cycle stops the model in time to publish
          mkdir -p "$SWRF/state" "$SWRF/logs" "$WEB"
          ln -sfn "$GITHUB_WORKSPACE/code" "$SWRF/repo"
          touch "$SWRF/state/installed"
          mkdir -p "$WEB/data"

      - name: System packages
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q gfortran m4 csh tcsh cmake rsync \
            libnetcdf-dev libnetcdff-dev netcdf-bin libhdf5-dev libopenmpi-dev openmpi-bin libpng-dev zlib1g-dev

      - name: Restore compiled model
        id: build
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/swrf/build
          key: wrf-build-u2404-${{ hashFiles('code/server/install.sh', 'code/server/env.sh', 'code/server/pick_option.py', 'code/server/patch_geogrid_tbl.py') }}

      - name: Compile model (first run only)
        if: steps.build.outputs.cache-hit != 'true'
        run: |
          STAGES="jasper netcdf wrf wps" bash "$SWRF/repo/server/install.sh"
          bash "$SWRF/repo/server/ci/prune_build.sh"

      - name: Keep compiled model
        if: steps.build.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/swrf/build
          key: ${{ steps.build.outputs.cache-primary-key }}

      - name: Python tools
        run: STAGES="netcdf python" bash "$SWRF/repo/server/install.sh"

      - name: Grid design id
        id: gh
        run: echo "id=$(python3 code/server/render_namelists.py geohash)" >> "$GITHUB_OUTPUT"

      - name: Restore static grid
        id: geo
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/swrf/work/static
          key: geo-${{ steps.gh.outputs.id }}

      - name: Static data (only when the grid changes)
        if: steps.geo.outputs.cache-hit != 'true'
        run: bash "$SWRF/repo/server/ci/static_data.sh"

      - name: Keep static grid
        if: steps.geo.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/swrf/work/static
          key: ${{ steps.geo.outputs.cache-primary-key }}

      - name: Forecast (short test, not published)
        run: |
          export ANY_CYCLE=1
          bash "$SWRF/repo/server/run_cycle.sh"

      - name: Report
        if: always()
        run: |
          R=$(ls -d "$WEB"/data/runs/*/ | head -1)
          python3 - "$R" <<'PY'
          import json, os, sys
          r = sys.argv[1]
          m = json.load(open(os.path.join(r, "manifest.json")))
          print("status", m["status"])
          for k, d in m["domains"].items():
              print(k, d["hours"], d.get("products"), d.get("rain24"))
          PY
          ls "$R"/d03/refl || true
          tail -n 30 "$SWRF"/work/run/*/wrf/rsl.error.0000 || true
          grep -i "d03\|nest" "$SWRF"/work/run/*/wrf/rsl.out.0000 | head -20 || true
          cat "$SWRF"/logs/cycle_*.log | tail -n 40
