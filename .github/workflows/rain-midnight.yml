# Rewrite the night rain report on the التذبذب tab from our evening (12 UTC) 3 km runs, by hand only (a repair:
# climate.yml already does this every night). The noon update and the daytime (00 UTC) run were removed on
# 14-15 Nov 2026 (Fahad). Code: saudi-wrf branch, server/climate. Results: climate-data branch (shared with climate.yml).
name: Rain report midnight rewrite

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'publish to the page (no: print the report only)'
        default: 'yes'

permissions:
  contents: write

concurrency:
  group: climate
  cancel-in-progress: false

jobs:
  midnight:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Code
        uses: actions/checkout@v4
        with:
          ref: saudi-wrf
          path: code

      - name: Python packages
        run: pip install -q numpy scipy shapely pillow netCDF4 pyshtools pygrib matplotlib cartopy arabic-reshaper python-bidi

      - name: Our model runs and the published page data
        run: |
          for b in model-data-sa:sa model-data:west model-data-nw:r_nw model-data-n:r_n model-data-c:r_c model-data-e:r_e model-data-se:r_se; do
            git clone -q --depth 1 --filter=blob:none --sparse --branch "${b%%:*}" "https://github.com/${GITHUB_REPOSITORY}" "/home/runner/${b##*:}" || continue
            git -C "/home/runner/${b##*:}" sparse-checkout set --no-cone '/runs.json' '/runs/*/manifest.json' '/runs/*/*/points.bin' || true
          done
          git clone -q --depth 1 --branch climate-data "https://github.com/${GITHUB_REPOSITORY}" /home/runner/out
          rm -rf /home/runner/out/.git

      - name: Rewrite the night report
        env:
          SA_DATA: /home/runner/sa
          WEST_DATA: /home/runner/west
          REGION_DATA: /home/runner/r_nw /home/runner/r_n /home/runner/r_c /home/runner/r_e /home/runner/r_se
        run: python3 code/server/climate/refresh_report.py /tmp /home/runner/out midnight

      - name: Publish
        if: inputs.publish == 'yes'
        run: |
          cd /home/runner/out
          git init -q -b data
          git -c user.name="climate bot" -c user.email="actions@users.noreply.github.com" add -A
          git -c user.name="climate bot" -c user.email="actions@users.noreply.github.com" commit -q -m "climate data, rain report midnight update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:climate-data
