# Rewrite the night rain report on the التذبذب tab from our evening (12 UTC) 3 km runs, by hand only (a repair:
# climate.yml already does this every night). The noon update and the daytime (00 UTC) run were removed on
# 14-15 Nov 2026 (Fahad). Code: saudi-wrf branch, server/climate. Results: climate-data branch (shared with climate.yml).
name: Rain report midnight rewrite

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'publish to the page (no: print the report only)'
        default: 'yes'

permissions:
  contents: write

concurrency:
  group: climate
  cancel-in-progress: false

jobs:
  midnight:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Code
        uses: actions/checkout@v4
        with:
          ref: saudi-wrf
          path: code

      - name: Python packages
        run: pip install -q numpy scipy shapely pillow netCDF4 pyshtools pygrib matplotlib cartopy arabic-reshaper python-bidi

      - name: Our model runs and the published page data
        run: |
          for b in model-data-sa:sa model-data:west model-data-nw:r_nw model-data-n:r_n model-data-c:r_c model-data-e:r_e model-data-se:r_se; do
            git clone -q --depth 1 --filter=blob:none --sparse --branch "${b%%:*}" "https://github.com/${GITHUB_REPOSITORY}" "/home/runner/${b##*:}" || continue
            git -C "/home/runner/${b##*:}" sparse-checkout set --no-cone '/runs.json' '/runs/*/manifest.json' '/runs/*/*/points.bin' || true
          done
          git clone -q --depth 1 --branch climate-data "https://github.com/${GITHUB_REPOSITORY}" /home/runner/out
          rm -rf /home/runner/out/.git

      - name: Rewrite the night report
        env:
          SA_DATA: /home/runner/sa
          WEST_DATA: /home/runner/west
          REGION_DATA: /home/runner/r_nw /home/runner/r_n /home/runner/r_c /home/runner/r_e /home/runner/r_se
        run: python3 code/server/climate/refresh_report.py /tmp /home/runner/out midnight

      - name: Publish
        if: inputs.publish == 'yes'
        # onto the LATEST climate-data, never a force-push of the copy cloned at the start (28 Nov 2026: that wiped
        # files other jobs pushed meanwhile): only the report's own keys and files are carried over
        run: |
          for t in 1 2 3 4; do
            rm -rf /home/runner/latest
            git clone -q --depth 1 --branch climate-data "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" /home/runner/latest
            python3 - <<'PY'
          import json, os, shutil
          src, dst = "/home/runner/out", "/home/runner/latest"
          a = json.load(open(os.path.join(src, "mjo.json")))
          b = json.load(open(os.path.join(dst, "mjo.json")))
          for k in ("report", "report_check", "ref_cmp", "verif", "cover_hist"):
              if k in a:
                  b[k] = a[k]
          json.dump(b, open(os.path.join(dst, "mjo.json"), "w"), ensure_ascii=False, separators=(",", ":"))
          for f in ("verif.json", "fig/refwave.png"):
              if os.path.exists(os.path.join(src, f)):
                  os.makedirs(os.path.dirname(os.path.join(dst, f)) or dst, exist_ok=True)
                  shutil.copy2(os.path.join(src, f), os.path.join(dst, f))
          if os.path.isdir(os.path.join(src, "reports")):
              shutil.copytree(os.path.join(src, "reports"), os.path.join(dst, "reports"), dirs_exist_ok=True)
          PY
            cd /home/runner/latest
            git -c user.name="climate bot" -c user.email="actions@users.noreply.github.com" add -A
            git -c user.name="climate bot" -c user.email="actions@users.noreply.github.com" commit -q -m "climate data, rain report midnight update $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
            git push -q origin HEAD:climate-data && exit 0
            cd /home/runner; sleep $((t * 10))
          done
          exit 1
