name: probe-ao
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: probe
        shell: bash {0}
        run: |
          curl -s -m 30 https://ftp.cpc.ncep.noaa.gov/cwlinks/ | grep -o 'href="[^"]*"' | grep -i "ao\|nao" | head -40
          for u in https://ftp.cpc.ncep.noaa.gov/cwlinks/norm.daily.ao.index.b500101.current.ascii https://ftp.cpc.ncep.noaa.gov/cwlinks/norm.daily.ao.cdas.z1000.19500101_current.csv; do
            echo "== $u"; curl -s -m 30 "$u" | tail -n 3; done
          echo "== forecast files"
          for f in $(curl -s -m 30 https://ftp.cpc.ncep.noaa.gov/cwlinks/ | grep -o 'href="[^"]*ao[^"]*\(csv\|txt\|ascii\)"' | sed 's/href="//;s/"//' | head -12); do
            echo "-- $f"; curl -s -m 30 "https://ftp.cpc.ncep.noaa.gov/cwlinks/$f" | head -n 3; curl -s -m 30 "https://ftp.cpc.ncep.noaa.gov/cwlinks/$f" | tail -n 2; done
