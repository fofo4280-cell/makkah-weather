name: probe-mjo
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: probe
        shell: bash {0}
        run: |
          pip install netCDF4 numpy >/dev/null 2>&1
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36"
          for u in https://www.bom.gov.au/clim_data/IDCKGEM000/rmm.74toRealtime.txt https://psl.noaa.gov/mjo/mjoindex/romi.cpcolr.1x.txt https://psl.noaa.gov/mjo/mjoindex/omi.1x.txt "https://iridl.ldeo.columbia.edu/SOURCES/.BoM/.MJO/.RMM/.amplitude/T/last/VALUES/data.ch"; do
            echo "== $u"; curl -sL -m 60 -A "$UA" -o x.txt -w "%{http_code}\n" "$u"; head -c 150 x.txt; echo; tail -n 3 x.txt; echo
          done
          echo "== CPC dirs"
          curl -s -m 30 https://ftp.cpc.ncep.noaa.gov/ | grep -o 'href="[^"]*"' | head -40
          curl -s -m 30 "https://www.cpc.ncep.noaa.gov/products/precip/CWlink/MJO/" | grep -o 'href="[^"]*\(txt\|dat\|ascii\)"' | head
