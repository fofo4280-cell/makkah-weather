name: probe-lightning
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: probe
        run: |
          pip install pillow numpy >/dev/null 2>&1 || true
          B=https://view.eumetsat.int/geoserver
          for t in $(python3 -c "
          import datetime as d
          n=d.datetime.utcnow().replace(second=0,microsecond=0); n-=d.timedelta(minutes=n.minute%5)
          print(' '.join((n-d.timedelta(minutes=5*k)).strftime('%Y-%m-%dT%H:%M:00Z') for k in range(0,8)))"); do
            curl -s -m 60 -D h.txt -o li.bin "$B/wms?service=WMS&request=GetMap&version=1.3.0&layers=mtg_fd:li_afa&styles=&crs=EPSG:4326&bbox=0,20,50,70&width=1250&height=1250&format=image/png&transparent=true&time=$t"
            echo "$t $(grep -i content-type h.txt | tr -d '\r')"
            python3 -c "
          from PIL import Image; import numpy as np,sys
          try:
            a=np.array(Image.open('li.bin').convert('RGBA'))
          except Exception as e:
            print('  not image', open('li.bin','rb').read(200)); sys.exit()
          m=a[...,3]>0; print('  nonzero px',int(m.sum()))
          if m.any():
            c,n=np.unique(a[m].reshape(-1,4),axis=0,return_counts=True); o=n.argsort()[::-1][:6]; print('  colours',[(tuple(c[i]),int(n[i])) for i in o])
            ys,xs=np.nonzero(m); print('  lat range',50-ys.max()*0.04,50-ys.min()*0.04,'lon',20+xs.min()*0.04,20+xs.max()*0.04)
          "
          done
