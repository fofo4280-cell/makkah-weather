# Keeps the last 12 hours of the Saudi radar for the model page's radar timeline (the free service keeps only 2 h).
# Every half hour; the archive is one commit on the radar-archive branch, replaced each time (no history kept).
name: Radar archive

on:
  schedule:
    - cron: '4,34 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Previous archive
        run: |
          mkdir -p arch
          if git fetch -q --depth 1 origin radar-archive 2>/dev/null; then git archive FETCH_HEAD | tar -x -C arch; fi
          ls arch | head
      - run: pip install -q numpy pillow
      - name: Fetch new frames
        run: python3 .github/scripts/radar_archive.py arch
      - name: Publish
        run: |
          cd arch
          git init -q -b radar-archive
          git config user.name "radar bot"; git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "Radar archive $(date -u +%FT%H:%MZ)"
          for k in 1 2 3; do git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" radar-archive && break; sleep 5; done
