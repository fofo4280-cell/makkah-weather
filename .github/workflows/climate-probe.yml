# A probe for developing the climate reports: the GFS 500 hPa height and temperature of the latest run for 16 days
# (1 degree), pushed to the probe-data branch. By hand only.
name: Climate probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: saudi-wrf
          path: code
      - run: pip install -q numpy scipy pillow netCDF4 pyshtools pygrib matplotlib cartopy arabic-reshaper python-bidi
      - name: Fetch
        run: |
          cd code/server/climate
          python3 - <<'PY'
          import numpy as np, daily
          cyc = daily.latest_cycle()
          z, t = [], []
          for d in range(16):
              f = daily.gfs_fields(cyc, d * 24, fields=(daily.Z500, daily.T500))
              z.append(f["z500"]); t.append(f["t500"])
          np.savez_compressed("/tmp/z500.npz", z=np.array(z), t=np.array(t), cycle=cyc, lat=daily.LAT1, lon=daily.LON1)
          print("saved", cyc)
          PY
      - name: Push
        run: |
          mkdir /tmp/p && cd /tmp/p && cp /tmp/z500.npz . && git init -q -b data && git add -A
          git -c user.name="probe" -c user.email="actions@users.noreply.github.com" commit -q -m probe
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:probe-data
