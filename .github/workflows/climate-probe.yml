# Convective-season test of GFS vs ECMWF (Fahad, 19 Nov 2026): observed satellite rain 1 Sep-15 Oct 2026 over
# Makkah's east and southeast. By hand only; nothing published (artifact + branch study-data-conv).
name: Convective model study

on:
  workflow_dispatch:
    inputs:
      script: {description: 'script and args', default: 'obs_box.py /home/runner/obs.npz'}

permissions:
  contents: write

jobs:
  obs:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: study/convective-models
          path: code
      - run: pip install -q numpy netCDF4
      - run: python3 code/server/study/${{ inputs.script }} 2>&1 | tee /home/runner/obs.log
      - name: Keep results
        if: always()
        run: |
          mkdir /tmp/p && cd /tmp/p && cp /home/runner/obs.npz /home/runner/obs.log . 2>/dev/null || true
          git init -q -b data && git add -A
          git -c user.name="study" -c user.email="actions@users.noreply.github.com" commit -q -m results
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:study-data-conv
