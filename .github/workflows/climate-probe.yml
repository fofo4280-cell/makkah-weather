# Test of the night sea-cell reading (seacell.py) against the observed rain (PERSIANN-PDIR-Now) over the coast
# stretches (Fahad, 26 Nov 2026). By hand only; results go to the test-seacell branch.
name: Climate probe

on:
  workflow_dispatch:
    inputs:
      first: {description: 'first day (YYYY-MM-DD)', default: '2026-10-01'}
      last: {description: 'last day (YYYY-MM-DD)', default: '2026-11-25'}
      ref: {description: 'code branch', default: 'feat/seacell'}

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          path: code
      - run: pip install -q numpy scipy shapely
      - name: Observed rain
        run: python3 code/server/climate/seacell_obs.py ${{ inputs.first }} ${{ inputs.last }} code/server/climate/seacell_cells.json /home/runner/scobs.json || true
      - name: Keep results
        if: always()
        run: |
          mkdir /tmp/p && cd /tmp/p && cp /home/runner/scobs.json . 2>/dev/null || true; ls
          git init -q -b data && git add -A
          git -c user.name="probe" -c user.email="actions@users.noreply.github.com" commit -q -m results
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:test-seacell
