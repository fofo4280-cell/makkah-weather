# Training and test of the ECMWF thunderstorm outlook of the river tab (stormec_study.py): ECMWF open data + PERSIANN
# PDIR-Now, by hand only. Results pushed to the storm-ec-study branch (coefficients + report).
name: Storm EC study

on:
  workflow_dispatch:
    inputs:
      ref: {description: 'code branch', default: 'saudi-wrf'}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        span: ["2024-11-15 2025-01-31", "2025-02-01 2025-04-15", "2025-04-16 2025-05-31", "2025-09-01 2025-10-31",
               "2025-11-01 2025-12-31", "2026-09-01 2026-10-15", "2026-10-16 2026-11-23"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          path: code
      - run: pip install -q numpy scipy pygrib
      - run: |
          set -- ${{ matrix.span }}
          python3 code/server/climate/stormec_study.py fetch $1 $2 part_$1.npz
          echo "P=$1" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ env.P }}
          path: part_*.npz
  fit:
    needs: fetch
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          path: code
      - run: pip install -q numpy scipy scikit-learn
      - uses: actions/download-artifact@v4
        with:
          path: parts
          merge-multiple: true
      - run: python3 code/server/climate/stormec_study.py fit parts out
      - name: Keep
        run: |
          cd out && git init -q -b data && git add -A
          git -c user.name="study" -c user.email="actions@users.noreply.github.com" commit -q -m "storm ec study"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:storm-ec-study
