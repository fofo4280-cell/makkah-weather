# Writes the daily model rain report for Makkah Region (reports/*.json).
# Scheduled at 08:50 UTC = 11:50 Riyadh, so the report is ready around 12:00.
# GitHub can start scheduled runs a few minutes late at busy times.
name: Daily model rain report

on:
  schedule:
    - cron: '50 8 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/daily-report.mjs'
      - 'js/geo.js'
      - '.github/workflows/daily-report.yml'

permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build report from ECMWF, GFS and ICON (Open-Meteo)
        run: node scripts/daily-report.mjs
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Daily model rain report $(TZ=Asia/Riyadh date +%F)"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 5; done
          exit 1
