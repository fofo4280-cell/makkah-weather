# One model server (GitHub runner): called by saudi-model.yml (twice-daily runs) and saudi-model-test.yml.
# A run too long for one runner's six hours is split: the first part stops at hour stop_h and hands its restart
# files to a second runner (resume: true), which goes on to the end. The maps of every hour are published as they
# are made, so the first hours reach the site at the usual time.
name: WRF job

on:
  workflow_call:
    inputs:
      name: {type: string, required: true}
      domains: {type: string, required: true}
      branch: {type: string, required: true}
      code_ref: {type: string, default: 'saudi-wrf'}
      cycle: {type: string, default: ''}
      stop_h: {type: string, default: ''}
      resume: {type: boolean, default: false}
      publish: {type: boolean, default: true}
      hours: {type: string, default: ''}
      window: {type: string, default: ''}
    outputs:
      handoff:
        description: "'yes' when the first part left restart files for a second runner"
        value: ${{ jobs.run.outputs.handoff }}

jobs:
  run:
    name: ${{ inputs.name }}${{ inputs.resume && ' (part 2)' || '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 358
    outputs:
      handoff: ${{ steps.pack.outputs.handoff }}
    env:
      SWRF: /home/runner/swrf
      WEB: /home/runner/web
      SWRF_TEST: '1'
      NPROC: '4'
      KEEP_RUNS: '3'
      CYCLES: '0 12'
      JOB_BUDGET_MIN: '342'
      GITHUB_TOKEN: ${{ github.token }}
      SWRF_DOMAINS: ${{ inputs.domains }}
      PUBLISH_BRANCH: ${{ inputs.branch }}
      SWRF_HOURS: ${{ inputs.hours }}
      SWRF_WINDOW: ${{ inputs.window }}
      SWRF_STOP_H: ${{ inputs.stop_h }}
    steps:
      - name: Model code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.code_ref }}
          path: code

      - name: Prepare folders
        run: |
          echo "JOB_T0=$(date -u +%s)" >> "$GITHUB_ENV"   # the cycle stops the model in time to publish
          mkdir -p "$SWRF/state" "$SWRF/logs" "$WEB/data"
          ln -sfn "$GITHUB_WORKSPACE/code" "$SWRF/repo"
          touch "$SWRF/state/installed"
          if [ "${{ inputs.publish }}" = true ]; then
            echo "PUBLISH_HOOK=$SWRF/repo/server/ci/publish.sh" >> "$GITHUB_ENV"
            if [ "${{ inputs.resume }}" != true ]; then
              rm -rf "$WEB/data"
              git clone -q --depth 1 --branch "$PUBLISH_BRANCH" "https://github.com/${GITHUB_REPOSITORY}" "$WEB/data" || mkdir -p "$WEB/data"
              rm -rf "$WEB/data/.git"
            fi
          fi

      - name: Restart files from the first part
        if: inputs.resume
        uses: actions/download-artifact@v4
        with:
          name: handoff-${{ inputs.name }}
          path: /home/runner/swrf/handoff

      - name: Unpack restart files
        if: inputs.resume
        run: echo "FORCE_CYCLE=$(bash "$SWRF/repo/server/ci/handoff.sh" unpack)" >> "$GITHUB_ENV"

      - name: System packages
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q gfortran m4 csh tcsh cmake rsync \
            libnetcdf-dev libnetcdff-dev netcdf-bin libhdf5-dev libopenmpi-dev openmpi-bin libpng-dev zlib1g-dev

      - name: Restore compiled model
        id: build
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/swrf/build
          key: wrf-build-u2404-${{ hashFiles('code/server/install.sh', 'code/server/env.sh', 'code/server/pick_option.py', 'code/server/patch_geogrid_tbl.py') }}

      - name: Compile model (first run only)
        if: steps.build.outputs.cache-hit != 'true'
        run: |
          STAGES="jasper netcdf wrf wps" bash "$SWRF/repo/server/install.sh"
          bash "$SWRF/repo/server/ci/prune_build.sh"

      - name: Keep compiled model
        if: steps.build.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/swrf/build
          key: ${{ steps.build.outputs.cache-primary-key }}

      - name: Python tools
        run: STAGES="netcdf python" bash "$SWRF/repo/server/install.sh"

      - name: Grid design id
        if: ${{ !inputs.resume }}
        id: gh
        run: echo "id=$(python3 code/server/render_namelists.py geohash)" >> "$GITHUB_OUTPUT"

      - name: Restore static grid
        if: ${{ !inputs.resume }}
        id: geo
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/swrf/work/static
          key: geo-${{ steps.gh.outputs.id }}

      - name: Static data (only when the grid changes)
        if: ${{ !inputs.resume && steps.geo.outputs.cache-hit != 'true' }}
        run: bash "$SWRF/repo/server/ci/static_data.sh"

      - name: Keep static grid
        if: ${{ !inputs.resume && steps.geo.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: /home/runner/swrf/work/static
          key: ${{ steps.geo.outputs.cache-primary-key }}

      - name: Forecast
        run: |
          if [ "${{ inputs.resume }}" = true ]; then
            export RESUME=1
          else
            if [ "${{ github.event_name }}" != "schedule" ]; then export ANY_CYCLE=1; fi
            if [ -n "${{ inputs.cycle }}" ]; then export FORCE_CYCLE="${{ inputs.cycle }}"; fi
          fi
          bash "$SWRF/repo/server/run_cycle.sh"

      - name: Publish results
        if: always() && inputs.publish
        run: bash "$SWRF/repo/server/ci/publish.sh"

      - name: Hand over to the second part
        id: pack
        if: always() && inputs.stop_h != ''
        run: |
          bash "$SWRF/repo/server/ci/handoff.sh" pack
          if [ -s "$SWRF/handoff/state.tar" ]; then echo "handoff=yes" >> "$GITHUB_OUTPUT"; fi

      - name: Keep restart files for the second part
        if: always() && steps.pack.outputs.handoff == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: handoff-${{ inputs.name }}
          path: /home/runner/swrf/handoff
          retention-days: 1
          compression-level: 1

      - name: Speed report
        if: always()
        run: |
          echo "---- wall minutes per model hour (domain 1 steps include the nests)"
          grep -h "Timing for main" "$SWRF"/work/run/*/wrf/rsl.out.0000 2>/dev/null | awk '$10 == "1:" {split($7,a,"_"); h=substr(a[2],1,2); t[a[1]" "h]+=$11} END {for (k in t) printf "%s %.1f\n", k, t[k]/60}' | sort || true
          cat "$SWRF"/logs/cycle_*.log 2>/dev/null | tail -n 25 || true
          echo "---- maps made"
          for m in "$WEB"/data/runs/*/manifest.json; do [ -f "$m" ] && python3 -c "import json,sys; m=json.load(open(sys.argv[1])); print(m['run'], m.get('status'), {k: (v.get('hours', [None])[0], v.get('hours', [None])[-1], v.get('products'), v.get('rain24'), v.get('days')) for k, v in m['domains'].items()})" "$m"; done || true

      - name: Keep the maps for checking the viewer (tests only)
        if: always() && !inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: web-${{ inputs.name }}${{ inputs.resume && '-2' || '' }}
          path: /home/runner/web/data
          retention-days: 3
          include-hidden-files: true
          if-no-files-found: ignore
