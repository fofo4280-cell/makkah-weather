name: rhcape-preview
on:
  push:
    branches: [rhcape-preview]
    paths-ignore: ['shots/**']
permissions:
  contents: write
jobs:
  shots:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          npm i --no-save playwright@1.48.2
          npx playwright install webkit chromium
          cat > live.mjs <<'JS'
          import { webkit, chromium, devices } from 'playwright';
          import fs from 'fs';
          const log = [];
          for (const [bn, bt] of [['webkit', webkit], ['chromium', chromium]]) {
            const b = await bt.launch();
            for (const [model, first] of [['ec', 'refl'], ['ec', 'rh700'], ['gfs', 'refl']]) {
              const ctx = await b.newContext({ ...devices['iPad Pro 11 landscape'], locale: 'ar' });
              const p = await ctx.newPage();
              p.on('console', (m) => log.push(`${bn} ${model} ${first} console: ${m.text()}`));
              p.on('pageerror', (e) => log.push(`${bn} ${model} ${first} pageerror: ${e.message}`));
              await p.addInitScript(([model, first]) => { localStorage.setItem('swrf.prod', first); localStorage.setItem('swrf.model', model); localStorage.setItem('swrf.dom', 'k3'); }, [model, first]);
              await p.goto('https://fofo4280-cell.github.io/makkah-weather/model/?t=' + Date.now());
              await p.waitForTimeout(15000);
              const st = async (tag) => {
                const r = await p.evaluate(() => ({ imgs: [...document.querySelectorAll('img.wx-layer')].map((i) => i.src.slice(0, 60)), opts: [...document.querySelectorAll('#prodSelect option')].map((o) => o.value), app: [...document.scripts].map((s) => s.src).filter((s) => s.includes('app.js')) }));
                log.push(`${bn} ${model} ${first} ${tag}: ${JSON.stringify(r)}`);
              };
              await st('start');
              if (first === 'refl') { await p.selectOption('#prodSelect', 'rh700').catch((e) => log.push('select fail ' + e.message)); await p.waitForTimeout(8000); await st('after-switch'); }
              await p.screenshot({ path: `shots/live-${bn}-${model}-${first}.png` });
              await ctx.close();
            }
            await b.close();
          }
          fs.writeFileSync('shots/live-log.txt', log.join('\n'));
          JS
          mkdir -p shots && node live.mjs
      - run: |
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add shots && git commit -m "preview shots" && git push
